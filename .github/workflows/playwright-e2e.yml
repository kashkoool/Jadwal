name: Playwright E2E

# Pre-staging E2E suite — runs the full Playwright matrix against a
# spun-up API + Web stack with Postgres and Redis. This workflow is
# kept separate from the main CI pipeline (ci.yml) because the e2e
# job is heavy (~10–15 min with cold compile + browser launch) and
# we want the fast feedback path for type-check / lint / unit tests
# to stay quick.
#
# Trigger:
#   - PR to main / develop  → runs both desktop + mobile projects
#   - workflow_dispatch     → manual run with optional --grep filter
#   - schedule (nightly)    → catches flake / dependency drift early
#
# Output:
#   - playwright-report/    → uploaded as workflow artefact on failure
#   - test-results/         → traces + screenshots + videos on failure

on:
  pull_request:
    # No `paths:` filter — E2E runs on EVERY PR to main/develop. This is required
    # for E2E to be a branch-protection REQUIRED check: a path-filtered workflow
    # that doesn't trigger never reports its check, which would deadlock any PR
    # that doesn't touch the filtered paths (docs/config-only). Matches how the
    # repo's other required checks (ci.yml) run on all PRs.
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      grep_pattern:
        description: 'Optional --grep pattern to filter specs'
        required: false
        type: string
  schedule:
    # Nightly at 02:00 UTC — catches network / dependency flake before
    # business hours.
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Total shard count — single source of truth for the `--shard=N/TOTAL`
  # denominator (the value that actually decides which tests each job runs).
  # Keep the `matrix.shard` list length in sync with this (GitHub Actions can't
  # generate a matrix list from an env value); the job name mirrors it too.
  TOTAL_SHARDS: 3
  # Test-only secrets — never used in production. The auth layer
  # accepts any 32+ char value here; rotating is fine and expected.
  JWT_SECRET: ci-only-test-secret-do-not-use-in-prod-eeeeeeeeeeeeeeeeeee
  JWT_REFRESH_SECRET: ci-only-test-refresh-secret-do-not-use-eeeeeeeeeeeeeee
  # Access-token TTL. Default is 900s (15 min); a sharded run is ~12 min and the
  # auth storageState is captured up-front in the setup project, so late-running
  # specs (vendor-* sort last) would hit an EXPIRED token → the page redirects to
  # login before the axios refresh lands → flaky "heading not visible". A 2-hour
  # TTL keeps the seeded session valid for the whole run. TEST-ONLY — prod sets
  # JWT_EXPIRATION via the ECS task definition, never this file.
  JWT_EXPIRATION: '7200'
  # Disable rate limiting for the E2E run. In CI every request originates from
  # 127.0.0.1, so the whole serial suite shares ONE rate-limit bucket → the auth
  # (5/min) and write tiers trip constantly → intermittent 429s on whichever
  # specs happen to hit the ceiling first (the random, shifting failure set we
  # saw). TEST-ONLY — production sets THROTTLE_ENABLED=true via the ECS task def.
  THROTTLE_ENABLED: 'false'
  DATABASE_URL: postgresql://jadwal:jadwal@localhost:5432/jadwal_e2e
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000/api
  API_PROXY_TARGET: http://localhost:4000/api
  E2E_API_URL: http://localhost:4000/api
  NODE_ENV: test
  # API boot dependencies — all of these are getOrThrow() calls that
  # fail at app start if missing. Values are placeholders only valid
  # for the ephemeral CI runner; real prod values come from ECS task-
  # definition env, not this workflow.
  API_URL: http://localhost:4000
  APP_URL: http://localhost:4000
  FRONTEND_URL: http://localhost:3000
  # CORS_ORIGIN is force-unwrapped at apps/api/src/main.ts:215 — without
  # it the API crashes at boot with "Cannot read properties of undefined
  # (reading 'split')". Comma-separated list of allowed origins.
  CORS_ORIGIN: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-test-google-client-id
  GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
  GOOGLE_CALLBACK_URL: http://localhost:4000/api/auth/google/callback
  PAY2M_MERCHANT_ID: CI-TEST-MERCHANT
  PAY2M_MERCHANT_NAME: CI Test Merchant
  PAY2M_SECURED_KEY: ci-test-pay2m-secured-key-32chars-min-len
  PAY2M_SECRET_WORD: ci-test-pay2m-secret-word
  PAY2M_RETURN_URL: http://localhost:3000/payment/callback
  PAY2M_API_URL: http://localhost:4000/mock-pay2m
  # VAPID keys are validated by the web-push library at boot
  # ('Vapid public key should be 65 bytes long when decoded'). Generated
  # at runtime in the 'Generate VAPID test keys' step below — this env
  # value is the placeholder the prod-guard requires; the real values
  # are exported into $GITHUB_ENV at runtime.
  VAPID_PUBLIC_KEY: placeholder-overridden-by-generate-step
  VAPID_PRIVATE_KEY: placeholder-overridden-by-generate-step
  VAPID_SUBJECT: mailto:ci@jadwal.qa
  # EmailUnsubscribeTokenService throws at module load if missing OR <32 chars,
  # independent of NODE_ENV. Test-only — never used to sign real emails.
  UNSUBSCRIBE_TOKEN_SECRET: ci-only-test-unsubscribe-secret-do-not-use-in-prod-eeeeee
  # Disable telemetry / analytics so CI runs are quiet.
  NEXT_TELEMETRY_DISABLED: 1
  PLAYWRIGHT_BROWSERS_PATH: 0

jobs:
  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A spec failure fails the job (the Run Playwright step is no longer
    # continue-on-error) → E2E is a real green/red check. Report + trace
    # artefacts still upload on failure via `if: always()` on the upload steps.
    strategy:
      fail-fast: false
      matrix:
        # Desktop Chrome + mobile Chrome (Pixel 7). Jadwal is a GCC marketplace
        # where most customer traffic is on phones, so mobile coverage matters.
        # mobile-chrome skips the admin/vendor spec families (desktop-only
        # dashboards, see playwright.config.ts testIgnore) and the visual-
        # regression spec is CI-skipped, so it runs the customer + landing flows.
        project: [chromium, mobile-chrome]
        # Shard the suite across 3 parallel jobs (each spins up its OWN
        # isolated Postgres+Redis+API+Web below, so there is NO cross-shard
        # shared-state race — within a shard workers=1 keeps it serial too).
        # This is what lets the full suite FINISH well inside the 30-min job
        # timeout (a single unsharded run overran it and got cancelled) and is
        # the prerequisite for turning E2E into a required merge gate. Keep the
        # denominator here in sync with `--shard=.../N` in the Run step below.
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jadwal
          POSTGRES_PASSWORD: jadwal
          POSTGRES_DB: jadwal_e2e
        options: >-
          --health-cmd "pg_isready -U jadwal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      # Reference data first (Country/City/Category) — seed-e2e-data.ts
      # asserts these exist (line 58: "Seed at least one Country before
      # this script."). Both seed scripts have a NODE_ENV=production
      # guard that refuses to run against prod.
      - name: Seed reference data
        working-directory: apps/api
        run: npx ts-node prisma/seed-e2e-reference.ts

      # Admin user with the credentials e2e/_fixtures/auth.ts expects
      # (admin@jadwal.qa / Admin123!). seed-admin.ts has a NODE_ENV=
      # production guard that requires SEED_ADMIN_EMAIL/PASSWORD when
      # in prod — here we're in NODE_ENV=test so the dev defaults apply,
      # but we override with the auth-fixture creds so the storage-state
      # setup at e2e/auth.setup.ts logs in successfully.
      - name: Seed admin
        working-directory: apps/api
        env:
          SEED_ADMIN_EMAIL: admin@jadwal.qa
          SEED_ADMIN_PASSWORD: Admin123!
          SEED_ADMIN_ALLOW_UPDATE: 'true'
        run: npx ts-node prisma/seed-admin.ts

      # Vendor + customer fixtures must exist before seed-e2e-data.ts
      # (it asserts at lines 65 + 67 that VENDOR_EMAIL / CUSTOMER_EMAIL
      # already have rows). All scripts have NODE_ENV=production guards.
      - name: Seed e2e vendor
        working-directory: apps/api
        run: npx ts-node prisma/seed-e2e-vendor.ts

      - name: Seed e2e customer
        working-directory: apps/api
        run: npx ts-node prisma/seed-e2e-customer.ts

      - name: Seed e2e fixtures
        working-directory: apps/api
        run: npx ts-node prisma/seed-e2e-data.ts

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      # Browser binaries and system libraries are installed SEPARATELY and on
      # purpose.
      #
      # `playwright install --with-deps` does both in one shot, but the deps
      # half shells out to apt-get, which on Azure-hosted runners blocks on the
      # dpkg lock held by unattended-upgrades. Measured on this repo: shards
      # stalled with ZERO output until the 30-minute job timeout killed them,
      # then reported as CANCELLED required checks that look like test
      # failures. Bounding and retrying it helped (5 of 6 shards went green)
      # but did not eliminate it — one runner stayed locked through three full
      # 5-minute attempts.
      #
      # So the MANDATORY step is the browser download, which touches no apt and
      # is therefore reliable, and the system libraries are best-effort. The
      # ubuntu-latest image already ships the libraries Chromium needs, which is
      # why the 5 passing shards passed. If one were genuinely missing, the
      # browser fails to launch and every test errors loudly — a clear signal,
      # not a silent one. That is a far better failure mode than a green-looking
      # queue blocked by an apt lock.
      - name: Install Playwright browser (required)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "browser download attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::playwright browser download failed after 3 attempts"
          exit 1

      # Best-effort: never fails the job. See the rationale above.
      - name: Install Playwright system libraries (best-effort)
        working-directory: apps/web
        timeout-minutes: 6
        continue-on-error: true
        run: |
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo systemctl kill --kill-who=all unattended-upgrades.service 2>/dev/null || true
          if timeout 240 npx playwright install-deps chromium; then
            echo "system libraries installed"
          else
            echo "::warning::playwright install-deps did not complete (apt lock contention on this runner). Continuing: the runner image ships the Chromium libraries, and a genuinely missing one will surface as a browser-launch error in the tests."
            # Wait for any apt/dpkg process to exit before touching the lock
            # files, then repair. Removing a lock still held by a live process
            # is how you get a genuinely corrupt package DB rather than a
            # merely interrupted one.
            for _ in $(seq 1 30); do
              pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1 || break
              sleep 2
            done
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sudo apt-get install -f -y 2>/dev/null || true
          fi

      # The API uses web-push at boot, which validates that VAPID keys
      # decode to 65-byte / 32-byte P-256 points. Generate a fresh
      # throwaway pair per run rather than hard-coding (avoids gitleaks
      # false positives and keeps the keys out of the repo entirely).
      - name: Generate VAPID test keys
        run: |
          npx --yes web-push generate-vapid-keys --json > /tmp/vapid.json
          PUB=$(node -e "console.log(require('/tmp/vapid.json').publicKey)")
          PRIV=$(node -e "console.log(require('/tmp/vapid.json').privateKey)")
          echo "VAPID_PUBLIC_KEY=$PUB" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$PRIV" >> "$GITHUB_ENV"

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build Web
        working-directory: apps/web
        run: npm run build

      - name: Start API server
        working-directory: apps/api
        run: |
          npm run start:prod &
          # Wait up to 60s for /health. Exit non-zero on timeout so the
          # workflow fails fast with a clear error rather than running
          # the test suite against a dead stack (which would surface as
          # cryptic per-spec assertion failures).
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/api/health 2>/dev/null; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: API did not become healthy within 60s" >&2
          exit 1

      - name: Start Web server
        working-directory: apps/web
        run: |
          npm run start &
          # Same fail-fast pattern as Start API server above.
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 2>/dev/null > /dev/null; then
              echo "Web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Web server did not become healthy within 60s" >&2
          exit 1

      - name: Run Playwright (${{ matrix.project }})
        working-directory: apps/web
        # NOTE: no continue-on-error — a spec failure now FAILS the job, so E2E
        # is a real green/red signal (the prerequisite for making it a required
        # merge gate). The report + trace artefacts still upload on failure via
        # `if: always()` on the upload steps below. If this proves flaky in
        # practice, re-add `continue-on-error: true` here to make it advisory
        # again rather than blocking (once it's a required branch-protection
        # check, an advisory revert also means removing it from that list).
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000/api
          # SECURITY — bind workflow_dispatch input to env var so it's
          # passed to the shell as a value, never as code. Embedding
          # ${{ inputs.x }} directly in a `run:` script would let any
          # actor with write access inject shell commands via this input.
          GREP_PATTERN: ${{ inputs.grep_pattern }}
        run: |
          if [ -n "$GREP_PATTERN" ]; then
            npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --grep "$GREP_PATTERN"
          else
            npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}
          fi

      - name: Upload Playwright report (on success or failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (on success or failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.project }}-shard${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 14
