# ═════════════════════════════════════════════════════════════════════════
# Deploy workflow — eu-central-1 (Frankfurt).
# Activated 2026-04-29 alongside the AWS infra bring-up.
#
# Trigger:
#   - push to main → build images, run migrations, roll api+web services
#   - workflow_dispatch → manual smoke deploys for hotfixes or testing
#
# All AWS-specific identifiers (account ID, ARNs, subnet IDs, etc.) live
# in GitHub repo Variables (Settings → Secrets and variables → Variables),
# not in this file. The only thing this file knows is which Variable
# names to read.
#
# ⚠ OPERATOR WARNING — secrets-in-logs:
#   Do NOT add `set -x`, `env`, `printenv`, or `echo $SECRET_*` for
#   debugging. GitHub Actions logs are visible to anyone with read
#   access to the repo, and a single accidental dump leaks AWS keys,
#   RDS passwords, JWT_SECRET, or PAY2M credentials irreversibly.
#   To debug a step, mask values with `::add-mask::` first or print
#   only fingerprints (length, first 4 chars).
# ═════════════════════════════════════════════════════════════════════════

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".coderabbit.yaml"
      - "LICENSE"
      - "SECURITY.md"
  workflow_dispatch: {}

# Default to read-only at workflow level — jobs that need write
# permissions (id-token: write for OIDC, packages: write for ECR push)
# declare them explicitly per-job below.
# Closes the OpenSSF Scorecard "Token-Permissions" finding.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # queue, don't cancel — interrupted deploys leave
                              # tasks in a half-transitioned state

env:
  AWS_REGION: ${{ vars.AWS_REGION }}            # e.g. eu-central-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}        # e.g. 123456789012.dkr.ecr.eu-central-1.amazonaws.com
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}          # e.g. jadwal-prod
  API_SERVICE: ${{ vars.API_SERVICE }}          # e.g. jadwal-api
  WEB_SERVICE: ${{ vars.WEB_SERVICE }}          # e.g. jadwal-web
  MIGRATE_TASK_DEF: ${{ vars.MIGRATE_TASK_DEF }} # e.g. jadwal-api-migrate

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Build + push api image (multi-stage, linux/amd64, fresh base)
  # ───────────────────────────────────────────────────────────────────────
  build-api:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC — no long-lived AWS credentials in GitHub
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}  # arn:aws:iam::ACCT:role/gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          pull: true                    # force fresh node:20-alpine base
          platforms: linux/amd64        # ECS Fargate x86 — never push arm64
          build-args: |
            APK_SECURITY_BUST=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/jadwal-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false             # smaller manifest; reduce ECR cost

  # ───────────────────────────────────────────────────────────────────────
  # 2. Build + push web image with env-specific NEXT_PUBLIC_API_URL
  # ───────────────────────────────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Fail-secure guard: every deploy build MUST have all required public
      # build-args set as repo Variables. Empty values silently bake broken
      # bundles (e.g. browser push subscribes against an empty VAPID key,
      # API calls go to an empty URL → mixed-content errors at runtime).
      # Better to break the deploy here than ship a broken image.
      - name: Assert required public build-args are set
        run: |
          missing=()
          [ -z "${NEXT_PUBLIC_API_URL}" ]   && missing+=("NEXT_PUBLIC_API_URL")
          [ -z "${NEXT_PUBLIC_VAPID_KEY}" ] && missing+=("NEXT_PUBLIC_VAPID_KEY")
          [ -z "${API_PROXY_TARGET}" ]      && missing+=("API_PROXY_TARGET")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Variables: ${missing[*]}"
            echo "Set them at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_URL:   ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_VAPID_KEY: ${{ vars.NEXT_PUBLIC_VAPID_KEY }}
          API_PROXY_TARGET:      ${{ vars.API_PROXY_TARGET }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_VAPID_KEY=${{ vars.NEXT_PUBLIC_VAPID_KEY }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            API_PROXY_TARGET=${{ vars.API_PROXY_TARGET }}
            APK_SECURITY_BUST=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/jadwal-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ───────────────────────────────────────────────────────────────────────
  # 3a. Build + push the migrations image (separate from the api image so
  #     the prod app container doesn't carry the Prisma CLI). Used by the
  #     migrate job below as a one-shot Fargate task before the rolling
  #     deploy.
  # ───────────────────────────────────────────────────────────────────────
  build-migrations:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile.migrations
          push: true
          pull: true
          platforms: linux/amd64
          build-args: |
            APK_SECURITY_BUST=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/jadwal-migrations:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ───────────────────────────────────────────────────────────────────────
  # 3b. Trivy scan — BLOCKING on any fixable HIGH or CRITICAL.
  #     The third deploy run (#25085510466) exit-coded 1 and we briefly
  #     relaxed to advisory on HIGH (PR #64). Honest investigation
  #     against ECR scan-on-push + GitHub Security SARIF showed:
  #       - ECR scan: 0 findings of any severity
  #       - Security tab (latest Trivy SARIF): 0 HIGH, 0 CRITICAL
  #       - Only 3 MEDIUM open (npm transitive deps)
  #     i.e. the briefly-flagged HIGH was a transient finding that got
  #     reclassified/patched in Trivy's DB between scans. Re-tightening
  #     is the proper prod posture — keep it.
  #
  #     If a future deploy fails here, the right move is NOT to relax
  #     this gate. Instead:
  #       1. Read the SARIF in GitHub Security tab to see the CVE
  #       2. If it's an Alpine OS package: bump the base-image SHA
  #          (Dependabot does this weekly anyway)
  #       3. If it's an npm transitive dep: add an `overrides:` entry
  #          in package.json or wait for the upstream patch
  # ───────────────────────────────────────────────────────────────────────
  trivy:
    needs: [build-api, build-web, build-migrations]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write   # SARIF upload to GitHub Security tab
    strategy:
      fail-fast: false
      matrix:
        image: [jadwal-api, jadwal-web, jadwal-migrations]
    steps:
      # Needed so the Trivy gate can read the repo-root .trivyignore (the
      # `trivyignores` input below). This job scans a pre-built ECR image and
      # otherwise has no working copy, so without a checkout trivy errors with
      # "cannot find ignorefile '.trivyignore'".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Pass 1: GATE — table format respects the `severity` filter and
      # exits 1 only on actual HIGH/CRITICAL fixable findings. This is
      # the deploy gate.
      #
      # IMPORTANT: do NOT use `format: sarif` here. The trivy-action's
      # SARIF builder ignores the severity filter (per SARIF spec, which
      # wants every finding represented), so it would exit-code 1 on
      # a single MEDIUM. The TABLE format respects severity correctly.
      - name: Trivy gate (CRITICAL,HIGH; fail closed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          # Honour the repo-root .trivyignore (documented, time-boxed CVE
          # risk-acceptances). The action does NOT auto-read it; without this
          # input TRIVY_IGNOREFILE is unset and every entry is ignored. See
          # .trivyignore for the justification + removal conditions.
          trivyignores: .trivyignore

      # Pass 2: SARIF — comprehensive scan, ALL severities, uploads to
      # GitHub Security tab. exit-code 0 because Pass 1 already gated.
      - name: Trivy SARIF (all severities, advisory)
        if: always()        # run even if gate fired, so Security tab updates
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          exit-code: 0
          ignore-unfixed: false
          vuln-type: os,library
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ───────────────────────────────────────────────────────────────────────
  # 4. Run Prisma migrations as a ONE-OFF ECS task BEFORE rolling the service
  #    (see devops skill §1.2 for why this ordering matters)
  # ───────────────────────────────────────────────────────────────────────
  migrate:
    needs: trivy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register a new revision of the migrate task def pointing at :${SHA}
      # of the SEPARATE migrations image (NOT jadwal-api — the prod api
      # image no longer carries the Prisma CLI; that's the whole point of
      # splitting migrations out). The task def JSON at infra/ecs/
      # migrate-task.json uses three placeholder tokens which we replace
      # before register-task-definition:
      #   - IMAGE_TAG_PLACEHOLDER  → jadwal-migrations:<SHA> ECR image URI
      #   - <AWS_ACCOUNT_ID>       → 12-digit account id (from sts caller-id)
      #   - <AWS_REGION>           → eu-central-1 (from env)
      # Without all three the call fails with "Unable to parse ARN" or
      # "Role ARN not found" because literal "<AWS_ACCOUNT_ID>" strings
      # leak through to the IAM role / SSM parameter / log group ARNs.
      - name: Register migrate task revision
        id: register
        run: |
          IMG="${{ env.ECR_REGISTRY }}/jadwal-migrations:${{ github.sha }}"
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          sed -i \
            -e "s|IMAGE_TAG_PLACEHOLDER|$IMG|g" \
            -e "s|<AWS_ACCOUNT_ID>|$ACCT|g" \
            -e "s|<AWS_REGION>|${AWS_REGION}|g" \
            infra/ecs/migrate-task.json
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://infra/ecs/migrate-task.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      # Resolve the live RDS master password from Secrets Manager every
      # time we run migrations. Static SSM DATABASE_URL would go stale on
      # the next 8-day auto-rotation and break this step until manually
      # re-synced — this keeps the migrate path self-healing.
      #
      # The fetched URL is injected via containerOverrides so the
      # password never lives in a logged env var, and `add-mask` ensures
      # any accidental echo in subsequent steps is redacted.
      - name: Resolve live DB URL for migrate task
        id: dburl
        env:
          RDS_SECRET_ARN: ${{ vars.RDS_SECRET_ARN }}
          DB_HOST:        ${{ vars.DB_HOST }}
          DB_NAME:        ${{ vars.DB_NAME }}
        run: |
          missing=()
          [ -z "$RDS_SECRET_ARN" ] && missing+=("RDS_SECRET_ARN")
          [ -z "$DB_HOST" ]        && missing+=("DB_HOST")
          [ -z "$DB_NAME" ]        && missing+=("DB_NAME")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub Variables: ${missing[*]}"
            exit 1
          fi

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$RDS_SECRET_ARN" \
            --version-stage AWSCURRENT \
            --query SecretString --output text)"
          USER="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys,urllib.parse;print(urllib.parse.quote(json.load(sys.stdin)["username"], safe=""))')"
          PASS="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys,urllib.parse;print(urllib.parse.quote(json.load(sys.stdin)["password"], safe=""))')"
          DB_URL="postgresql://${USER}:${PASS}@${DB_HOST}:5432/${DB_NAME}?schema=public&sslmode=verify-full&sslrootcert=/app/prisma/rds-ca-bundle.pem"

          # Mask so subsequent echo / set -x can't leak.
          echo "::add-mask::$PASS"
          echo "::add-mask::$DB_URL"
          {
            echo "db_url<<__EOF__"
            echo "$DB_URL"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Run migration (RunTask, wait for exit code 0)
        env:
          DB_URL: ${{ steps.dburl.outputs.db_url }}
        run: |
          # Build containerOverrides JSON in a tempfile (CLI's --overrides
          # arg has shell-quoting hazards with embedded JSON). The DB_URL
          # value is masked via ::add-mask:: above so it won't appear in
          # the action log even if a future step prints process env.
          OVERRIDES=$(jq -nc \
            --arg name "migrations" \
            --arg url "$DB_URL" \
            '{containerOverrides:[{name:$name,environment:[{name:"DATABASE_URL",value:$url}]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ steps.register.outputs.revision }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=${{ vars.PRIVATE_SUBNETS }},securityGroups=${{ vars.MIGRATE_SG }},assignPublicIp=DISABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          echo "Waiting for migrate task to complete: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT" != "0" ]; then
            echo "::error::Migration task exited with $EXIT — halting deploy"
            exit 1
          fi
          echo "Migration complete"

  # ───────────────────────────────────────────────────────────────────────
  # 5. Rolling deploy — api + web services updated in parallel
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: jadwal-api, img: jadwal-api, taskdef: api-task.json }
          - { name: jadwal-web, img: jadwal-web, taskdef: web-task.json }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register a new task-def revision from the COMMITTED IaC source-of-truth
      # (infra/ecs/<service>-task.json), then update the service to point at it.
      #
      # Pattern matches the existing migrate-task.json flow (see job 4 above):
      # the JSON has three placeholder tokens which are substituted at deploy
      # time so the committed file stays portable / account-agnostic:
      #   IMAGE_TAG_PLACEHOLDER → <ECR_REGISTRY>/<img>:<git-sha>
      #   <AWS_ACCOUNT_ID>      → 12-digit account id (from sts caller-id)
      #   <AWS_REGION>          → eu-central-1 (from env)
      #
      # Why register from committed JSON instead of `aws ecs describe`:
      #   - Manual console edits to the task def get OVERWRITTEN on next deploy
      #     → infra/ecs/*.json is the only source of truth (IaC discipline)
      #   - PR review on infra/ecs/*.json catches risky changes (CPU/memory
      #     bumps, secret renames, IAM role changes) before they ship
      #   - Onboarding: read the JSON to know exactly what runs in prod, no
      #     console crawling
      #   - Recovery: a wiped task family can be rebuilt by re-running deploy
      #
      # Rollback: previous-revision ARN is still active in ECS; switching back
      # is `aws ecs update-service --task-definition jadwal-api:<prev-rev>`.
      - name: Deploy ${{ matrix.service.name }}
        env:
          RDS_SECRET_ARN: ${{ vars.RDS_SECRET_ARN }}
          DB_HOST:        ${{ vars.DB_HOST }}
          DB_NAME:        ${{ vars.DB_NAME }}
        run: |
          IMG="${{ env.ECR_REGISTRY }}/${{ matrix.service.img }}:${{ github.sha }}"
          ACCT="$(aws sts get-caller-identity --query Account --output text)"

          # Required-vars guard — only relevant when registering the api task
          # (web/migrate templates don't use these placeholders, so an empty
          # value here would still pass the post-sed grep but ship a broken
          # api revision that fails at task start).
          if [ "${{ matrix.service.name }}" = "jadwal-api" ]; then
            missing=()
            [ -z "$RDS_SECRET_ARN" ] && missing+=("RDS_SECRET_ARN")
            [ -z "$DB_HOST" ]        && missing+=("DB_HOST")
            [ -z "$DB_NAME" ]        && missing+=("DB_NAME")
            if [ ${#missing[@]} -ne 0 ]; then
              echo "::error::Missing required GitHub Variables for jadwal-api: ${missing[*]}"
              echo "Set them at: Settings → Secrets and variables → Actions → Variables"
              exit 1
            fi
          fi

          # Defensive copy — never sed-edit the committed file in place.
          cp infra/ecs/${{ matrix.service.taskdef }} /tmp/td.json
          sed -i \
            -e "s|IMAGE_TAG_PLACEHOLDER|$IMG|g" \
            -e "s|<AWS_ACCOUNT_ID>|$ACCT|g" \
            -e "s|<AWS_REGION>|${AWS_REGION}|g" \
            -e "s|RDS_SECRET_ARN_PLACEHOLDER|${RDS_SECRET_ARN}|g" \
            -e "s|DB_HOST_PLACEHOLDER|${DB_HOST}|g" \
            -e "s|DB_NAME_PLACEHOLDER|${DB_NAME}|g" \
            /tmp/td.json

          # Fail loud if any placeholder didn't get substituted — this catches
          # a forgotten placeholder before AWS rejects the register call with
          # a less obvious "Unable to parse ARN" error.
          if grep -q '<AWS_ACCOUNT_ID>\|<AWS_REGION>\|IMAGE_TAG_PLACEHOLDER\|RDS_SECRET_ARN_PLACEHOLDER\|DB_HOST_PLACEHOLDER\|DB_NAME_PLACEHOLDER' /tmp/td.json; then
            echo "::error::Unsubstituted placeholder remains in /tmp/td.json"
            grep -n '<AWS_ACCOUNT_ID>\|<AWS_REGION>\|IMAGE_TAG_PLACEHOLDER\|RDS_SECRET_ARN_PLACEHOLDER\|DB_HOST_PLACEHOLDER\|DB_NAME_PLACEHOLDER' /tmp/td.json
            exit 1
          fi

          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.name }} \
            --task-definition "$NEW_TD" \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100"

          # Wait for the rolling deployment to COMPLETE. The built-in
          # `aws ecs wait services-stable` caps at 40×15s = 10 min, too short for
          # this fixed-capacity infra (minHealthy=100 + a slow cold start under a
          # 1-hour health-check grace): it false-fails while prod actually updates.
          # Poll rolloutState instead — succeed on COMPLETED, fail ONLY on a real
          # FAILED (circuit-breaker rollback), give up after 30 min.
          CLUSTER="${{ env.ECS_CLUSTER }}"; SVC="${{ matrix.service.name }}"
          DEADLINE=$(( $(date +%s) + 1800 ))
          while true; do
            STATE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SVC" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text)
            echo "[deploy] $SVC rolloutState=$STATE"
            if [ "$STATE" = "COMPLETED" ]; then echo "[deploy] $SVC stable"; break; fi
            if [ "$STATE" = "FAILED" ]; then
              echo "::error::$SVC deployment FAILED (ECS circuit breaker rolled back)"; exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::$SVC did not reach rolloutState=COMPLETED within 30 min"; exit 1
            fi
            sleep 15
          done

      - name: Log rollback command for this deploy
        if: success()
        run: |
          echo "::notice::Rollback: aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.name }} --task-definition <previous-revision>"

  # ───────────────────────────────────────────────────────────────────────
  # 6. Smoke test — prove the public endpoints are healthy after deploy.
  # Strengthens Layer 5 of the auto-merge safety net: a Dependabot patch
  # that builds, scans, migrates, and deploys cleanly but breaks runtime
  # is caught here, and the ECS deployment circuit breaker rolls back.
  #
  # Hard gates (both must return 200 or the deploy fails):
  #   - /api/health  → API target group health endpoint
  #   - /            → Web target group homepage (Next.js)
  #
  # TODO: add /api/catalog/cities and /api/catalog/featured to this list
  # once the DB seed is run on staging (currently returns 500 because the
  # cities/categories tables are empty — adding those probes now would
  # block every deploy until the seed lands).
  # ───────────────────────────────────────────────────────────────────────
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECS targets are healthy (AWS-side, bypass Cloudflare)
        run: |
          # Why AWS-side, not curl through Cloudflare:
          #
          # The previous HTTP curl smoke step probed jadwal.qa via Cloudflare
          # so it exercised the full DNS → CF edge → ALB → ECS chain. That
          # made it sensitive to Cloudflare-side conditions that have nothing
          # to do with whether the deploy succeeded:
          #   - Bot Fight Mode false-positives on curl UA (we had to disable
          #     BFM globally to keep deploys green — security loss).
          #   - Edge / DDoS auto-mitigation throttling the deploy runner IP.
          #   - DNS propagation hiccups, transient CF 5xx, etc.
          #
          # The actual question this step needs to answer is: "Is the new
          # ECS task healthy and serving traffic from the ALB's perspective?"
          # That's a question best asked of AWS directly, not via a public
          # round-trip through CDN+WAF+CF.
          #
          # Pattern (AWS / Terraform ECS modules / GitHub Actions ECS docs
          # all use this): wait services-stable → describe target health.
          # If the new task replaces the old in the target group AND reports
          # healthy, the deploy is verifiably successful. Anything user-side
          # broken (DNS, CF, WAF) is monitored by separate synthetic checks,
          # not the deploy gate.
          #
          # Side benefit: re-enabling Bot Fight Mode no longer breaks deploys.

          set -eo pipefail

          declare -A TG_NAMES=(
            ["jadwal-api"]="API"
            ["jadwal-web"]="Web"
          )

          OVERALL_FAIL=0
          for SERVICE in "${!TG_NAMES[@]}"; do
            LABEL="${TG_NAMES[$SERVICE]}"

            # Pull the service's target-group ARN. Belt-and-suspenders: even
            # though `deploy` already waited for services-stable on each
            # service, we re-query here in case the smoke step ran out of
            # band (re-run from the GH UI, etc).
            TG_ARN=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "$SERVICE" \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
              echo "::error::[$LABEL] could not resolve target group for $SERVICE"
              OVERALL_FAIL=1
              continue
            fi

            # Count healthy targets. ECS rolling deploy with circuit breaker
            # already aborts on its own if new tasks fail health checks, so
            # we usually arrive here with healthy=desiredCount. This is the
            # final assertion before declaring deploy-success.
            HEALTHY=0
            for ATTEMPT in 1 2 3; do
              HEALTHY=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG_ARN" \
                --region ${{ env.AWS_REGION }} \
                --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
                --output text)
              if [ "$HEALTHY" -ge 1 ]; then
                break
              fi
              echo "[wait] [$LABEL] attempt $ATTEMPT: 0 healthy targets, retrying in 15s"
              sleep 15
            done

            if [ "$HEALTHY" -lt 1 ]; then
              echo "::error::[$LABEL] no healthy targets in $TG_ARN after retries"
              OVERALL_FAIL=1
            else
              echo "[PASS] [$LABEL] $HEALTHY healthy target(s) in target group"
            fi
          done

          if [ "$OVERALL_FAIL" = "1" ]; then
            echo "::error::Smoke verification failed — at least one service has zero healthy targets. ECS circuit breaker should be rolling back."
            exit 1
          fi
          echo "All ECS services have healthy targets — deploy verified."

