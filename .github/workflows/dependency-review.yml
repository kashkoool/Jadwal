# Dependency Review — block PRs that introduce vulnerable / non-allowed deps
# BEFORE they merge to main, instead of after-the-fact via Dependabot alerts.
#
# How it differs from the existing security-scan.yml:
#   - security-scan.yml runs Semgrep / CodeQL / retire.js / npm audit on the
#     POST-MERGE main branch. Catches things after they land.
#   - This action runs on each PR's diff vs main. Reviews ONLY the dependency
#     changes (added / removed / version-bumped) and flags any that introduce
#     advisories at the configured severity. Stops bad deps at the gate.
#
# Free for public repos. Uses the GitHub-hosted Advisory Database (same source
# as Dependabot) so no extra API keys / config required.

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write   # comment on the PR with a summary table

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block any new HIGH or CRITICAL vuln from landing.
          # MODERATE is allowed because npm transitive trees often have noise
          # we cannot patch without breaking changes. Existing 6 dev-only
          # MODERATEs are tracked in run.txt §LIVE AWS RESOURCES + Security
          # tab; PRs that ADD a new MODERATE will surface in the action's
          # comment but won't fail.
          fail-on-severity: high

          # Surface a markdown table comment on the PR — visible to reviewers
          # without diving into the action log.
          comment-summary-in-pr: on-failure

          # Acceptable open-source licences for any newly-added dep.
          # Mirrors the licences already in our tree (MIT / Apache 2.0 / BSD
          # are dominant, ISC / 0BSD also common in node ecosystem).
          # Flag anything outside the list — usually means a copyleft GPL
          # crept in via a transitive bump.
          #
          # MPL-2.0 added 2026-05-04 — Mozilla Public License 2.0 is "weak
          # copyleft" with file-level scope (modifications to MPL files
          # must be MPL; using as a library creates no obligation). Comes
          # in via lightningcss platform binaries (bundled by Tailwind /
          # Next.js) and is the same licence Firefox itself ships under.
          # Standard practice in JS ecosystems is to allow it.
          #
          # LGPL-3.0-or-later covers the @img/sharp-libvips-* platform
          # binaries that sharp depends on. This is NOT a new exposure: the
          # same licence is already in the tree and in production today via
          # sharp 0.34 (libvips 1.2.4). It surfaced only when the sharp 0.35
          # upgrade moved those packages to 1.3.2, because Dependency Review
          # evaluates CHANGED dependencies — an unchanged package is never
          # re-checked. Refusing it here would not remove the licence from
          # the image, it would only block upgrades of a package we already
          # ship.
          #
          # libvips is consumed as an unmodified, dynamically-loaded native
          # addon, which is the arrangement LGPL is written for; we neither
          # modify nor statically link it.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            CC0-1.0, CC-BY-3.0, CC-BY-4.0, Unlicense, Python-2.0,
            BlueOak-1.0.0, MIT-0, MPL-2.0, LGPL-3.0-or-later

          # Package-scoped exemptions. Deliberately NOT added to
          # allow-licenses above: doing that would silently admit EVERY
          # future dependency under the same licence, whereas these two are
          # exempted by name and anything else new still gets flagged.
          #
          # Both arrive via `prisma` -> @prisma/studio-core, i.e. Prisma
          # Studio, the local GUI. `prisma` is a devDependency, and the API
          # runtime image explicitly deletes it (see `rm -rf
          # node_modules/prisma` in apps/api/Dockerfile). So neither package
          # is distributed by us in any artefact.
          #
          #   elkjs (EPL-2.0) - graph layout for Studio's schema view.
          #     EPL-2.0 is weak copyleft whose obligations attach on
          #     DISTRIBUTION of the covered work or a derivative. We neither
          #     modify it nor ship it; it runs on a developer's machine when
          #     they open Prisma Studio.
          #
          #   robust-predicates ("LicenseRef-scancode-public-domain AND
          #     Unlicense") - geometric predicates reached through
          #     d3-delaunay -> @visx/* charts in Studio. Effectively public
          #     domain and MORE permissive than anything listed above;
          #     Unlicense is already allowed. It only trips the check because
          #     the AND-expression contains a non-SPDX LicenseRef that the
          #     matcher cannot resolve.
          allow-dependencies-licenses: >-
            pkg:npm/elkjs, pkg:npm/robust-predicates
