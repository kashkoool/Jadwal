## Docker image-size budget — gate prod images at PR time.
##
## Builds both prod images and runs `dive --ci` against each. Fails the PR
## if either the dive thresholds in `.dive-ci` are exceeded OR the absolute
## image size crosses the per-image cap below.
##
## Why a separate workflow (not a job in ci.yml): keeps the build artifacts
## isolated, and lets us tune triggers — this only runs when something that
## could affect image size actually changes. ci.yml's bundle-size job
## measures the JS bundle (Next.js client output); this one measures the
## final docker image.

name: Docker image-size budget

# Read-only — only builds images and runs `dive --ci`, no writes anywhere.
# Closes the OpenSSF Scorecard "Token-Permissions" finding.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/api/package.json"
      - "apps/web/package.json"
      - "package.json"
      - "package-lock.json"
      - "apps/api/prisma/schema.prisma"
      - ".dive-ci"
      - ".github/workflows/docker-size-budget.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/api/package.json"
      - "apps/web/package.json"
      - "package.json"
      - "package-lock.json"
      - "apps/api/prisma/schema.prisma"
      - ".dive-ci"

jobs:
  api-image-size:
    name: API image (cap 1 GB)
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: jadwal-api-prod:ci
      MAX_BYTES: "1073741824"  # 1 GB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build prod API image
        run: docker build -f apps/api/Dockerfile -t "${{ env.IMAGE_TAG }}" .

      - name: Check absolute size
        run: |
          size=$(docker image inspect "${{ env.IMAGE_TAG }}" --format='{{.Size}}')
          mb=$((size / 1048576))
          echo "API image size: ${mb} MB (raw bytes: ${size})"
          if [ "${size}" -gt "${{ env.MAX_BYTES }}" ]; then
            echo "::error::API image (${mb} MB) exceeds the budget of $(( ${{ env.MAX_BYTES }} / 1048576 )) MB."
            exit 1
          fi

      - name: Run dive layer-efficiency check
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.dive-ci:/.dive-ci" \
            -e CI=true \
            wagoodman/dive:latest \
            "${{ env.IMAGE_TAG }}" \
            --ci \
            --ci-config /.dive-ci

  web-image-size:
    name: Web image (cap 500 MB)
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      IMAGE_TAG: jadwal-web-prod:ci
      MAX_BYTES: "524288000"  # 500 MB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build prod web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg API_PROXY_TARGET=http://api:4000/api \
            -t "${{ env.IMAGE_TAG }}" .

      - name: Check absolute size
        run: |
          size=$(docker image inspect "${{ env.IMAGE_TAG }}" --format='{{.Size}}')
          mb=$((size / 1048576))
          echo "Web image size: ${mb} MB (raw bytes: ${size})"
          if [ "${size}" -gt "${{ env.MAX_BYTES }}" ]; then
            echo "::error::Web image (${mb} MB) exceeds the budget of $(( ${{ env.MAX_BYTES }} / 1048576 )) MB."
            exit 1
          fi

      - name: Run dive layer-efficiency check
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.dive-ci:/.dive-ci" \
            -e CI=true \
            wagoodman/dive:latest \
            "${{ env.IMAGE_TAG }}" \
            --ci \
            --ci-config /.dive-ci
