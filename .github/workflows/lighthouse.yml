# ═════════════════════════════════════════════════════════════════════════
# Lighthouse — Core Web Vitals + accessibility + best-practices + SEO
#
# Runs against the live production site weekly + on demand. Advisory only:
# does NOT block deploys. The point is to surface regressions in the
# `Workflow run → annotations` view and have a public-storage URL that
# can be linked in PR descriptions for marketing-page or homepage changes.
#
# Trigger:
#   - workflow_dispatch (manual, optional URL override)
#   - schedule (weekly, Monday 06:00 UTC) — catches drift even on weeks
#     with no deploys (third-party CDN, font, image-CDN regressions)
#
# Notes:
#   - We hit the live https://jadwal.qa origin directly (Cloudflare-fronted).
#     If Cloudflare Bot Fight Mode ever blocks the runner IP, the job will
#     fail-soft (continue-on-error: true) and the artefact will be empty.
#     Re-running from the GH UI from a different runner usually works.
#   - 3 runs per URL; lhci median-aggregates them, so transient cold-start
#     spikes don't poison the report.
#   - Uses --upload.target=temporary-public-storage which posts to Google's
#     LHCI public-report bucket and prints a short-lived viewable URL in
#     the job log. No sensitive data is in the report (it's all what the
#     unauthenticated public sees anyway).
# ═════════════════════════════════════════════════════════════════════════

name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit (default: https://jadwal.qa/)"
        required: false
        default: "https://jadwal.qa/"
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run Lighthouse CI
        id: lhci
        # Advisory only — failures here surface in the annotations + the
        # uploaded artefact, but don't block any deploy.
        continue-on-error: true
        env:
          LHCI_URL: ${{ inputs.url || 'https://jadwal.qa/' }}
        run: |
          mkdir -p .lighthouseci
          npx --yes @lhci/cli@0.13.0 autorun \
            --collect.url="$LHCI_URL" \
            --collect.numberOfRuns=3 \
            --collect.settings.preset=desktop \
            --upload.target=temporary-public-storage \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance="warn" \
            --assert.assertions.categories:accessibility="warn" \
            --assert.assertions.categories:best-practices="warn" \
            --assert.assertions.categories:seo="warn" \
            || echo "::warning::Lighthouse run completed with assertion warnings (non-blocking)"

      - name: Upload Lighthouse report artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
          if-no-files-found: warn
