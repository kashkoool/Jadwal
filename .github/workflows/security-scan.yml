name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Weekly full scan on Monday 06:00 UTC — catches newly-disclosed CVEs
    # even on code that hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write   # needed for CodeQL + SARIF upload
  pull-requests: read

jobs:
  # ─── Semgrep — static analysis for OWASP Top 10 + Node.js rules ───
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:7810f1d7884974ab6dda7bef8f4a2c8e165ea2142fd8260515d380e4f1407263
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Semgrep
        # Block deploy on ERROR-severity only. WARNING-level rules
        # (njsscan Math.random, regex-DoS heuristic, "string equality
        # could be timing attack") fire on a lot of false positives
        # in this codebase — UI preview keys, bounded character-class
        # regexes, comparisons between two values the user just typed
        # in their own browser. Keeping WARNING in the SARIF upload
        # below means they still appear in the Security tab for
        # review; they just don't gate CI.
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/nodejsscan \
            --config=p/typescript \
            --config=p/react \
            --config=p/javascript \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            --sarif --output=semgrep.sarif \
            apps/
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── retire.js — known-vulnerable JS libs in node_modules AND bundle ───
  retirejs:
    name: retire.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install retire
        run: npm install -g retire

      - name: Retire scan — API
        run: retire --path apps/api --severity high --exitwith 1

      - name: Retire scan — Web
        run: retire --path apps/web --severity high --exitwith 1

  # ─── CodeQL — GitHub's own deep static analysis ───
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─── npm audit — one more time, with signatures verified ───
  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install with frozen lockfile
        run: npm ci
      - name: Verify package integrity signatures
        run: npm audit signatures
      # See scripts/audit-gate.mjs — fails on any high/critical production
      # advisory that is not explicitly waived (with a reason + expiry) in
      # .audit-allowlist.json, so newly introduced vulnerabilities still block
      # while known-unfixable-upstream ones don't freeze the whole repo.
      - name: Production audit (allowlist-aware)
        run: node scripts/audit-gate.mjs apps/api apps/web
