# ⚠ OPERATOR WARNING — secrets-in-logs:
#   Do NOT add `set -x`, `env`, `printenv`, or `echo $SECRET_*` for
#   debugging. GitHub Actions logs are visible to anyone with read
#   access to the repo, and a single accidental dump leaks credentials
#   irreversibly. Mask with `::add-mask::` or print only fingerprints
#   (length, first 4 chars) when triaging a step.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Default to read-only at workflow level — every job that needs more
# (e.g. security-events: write for SARIF upload) declares it explicitly.
# Closes the OpenSSF Scorecard "Token-Permissions" finding.
permissions:
  contents: read

env:
  # Match the Dockerfiles (apps/api/Dockerfile, apps/web/Dockerfile,
  # *.dev). Bumped 20 -> 22 on 2026-04-27 alongside the base-image
  # security refresh — newer glibc / openssl / zlib clears the bulk
  # of the Trivy HIGH/CRITICAL OS-package list.
  NODE_VERSION: 22

jobs:
  # ─── Stage 1: Type Check ────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://api.placeholder.com/api"
        run: npx tsc --noEmit

  # ─── Stage 2: Dependency Audit ────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any high/critical advisory in PRODUCTION deps that is not
      # explicitly waived in .audit-allowlist.json. A bare `npm audit
      # --audit-level=high` also fails on advisories with NO upstream fix,
      # which made this gate unsatisfiable and blocked every unrelated PR
      # (including security fixes). The allowlist is keyed by GHSA id and each
      # entry expires, so a NEW vulnerability still blocks the merge.
      - name: npm audit (production deps, allowlist-aware)
        run: node scripts/audit-gate.mjs apps/api apps/web

  # ─── Stage 3: Secret Detection ──────────────────────────────────
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Stage 4: Prisma Schema Check ──────────────────────────────
  prisma:
    name: Prisma Schema Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Check Prisma client generation
        working-directory: apps/api
        run: npx prisma generate

      - name: Prisma version is in lockstep with migrations image
        # The migrations image (apps/api/Dockerfile.migrations) ships its
        # own copy of the `prisma` CLI pinned to an exact version. The
        # CLI engine MUST match the engine the API workspace builds the
        # client with — a desync silently breaks `migrate deploy` against
        # databases shaped by the new schema. Both must be exact pins,
        # both must be the same version. Caret-prefixed deps in api would
        # let `npm update` drift them apart without tripping any test.
        run: |
          API_VER=$(node -p "require('./apps/api/package.json').devDependencies.prisma")
          MIG_VER=$(grep -oP '"prisma":"\K[^"]+' apps/api/Dockerfile.migrations | head -1)
          echo "api/package.json prisma=$API_VER  Dockerfile.migrations prisma=$MIG_VER"
          if [ -z "$API_VER" ] || [ -z "$MIG_VER" ] || [ "$API_VER" != "$MIG_VER" ]; then
            echo "❌ Prisma version drift between api workspace and migrations image"
            exit 1
          fi
          if echo "$API_VER" | grep -qE '^[\^~]'; then
            echo "❌ api workspace prisma must be an exact pin (no ^ or ~), got: $API_VER"
            exit 1
          fi
          echo "✅ Prisma versions locked"

  # ─── Stage 4a2: Frontend ↔ Backend API contract ────────────────
  # Guards the exact hole that shipped a broken admin cover-image upload to
  # production: the web app POSTed to `/upload/image`, an endpoint that never
  # existed, so every upload 404'd into a catch and surfaced as "Upload failed".
  #
  # Nothing else in this pipeline can catch that class of bug — the URL is just
  # a string, so TypeScript and ESLint are blind to it; the API tests only prove
  # the API's own routes work; and E2E only covers flows that have specs.
  #
  # This asserts every API call the frontend makes resolves to a route the API
  # actually exposes, with the same HTTP method. Static, no infra, ~1s.
  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend calls must hit real backend routes
        run: node scripts/check-api-contract.mjs

  # ─── Stage 4a2: Single React ───────────────────────────────────
  # A second copy of React makes every hook resolve against a null dispatcher
  # ("Cannot read properties of null (reading 'useState')") and takes the whole
  # frontend down. A stale `overrides` pin did exactly that to every Dependabot
  # PR for months while `main` looked healthy. Lockfile-only check — no install.
  single-react:
    name: Single React
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — this job only reads package-lock.json and
      # never talks to git, so the checkout token has no business being written
      # into .git/config where a later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Exactly one copy of react / react-dom in the tree
        run: node scripts/check-single-react.mjs

  # ─── Stage 4b: Lint (eslint on api + web) ──────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint API
        working-directory: apps/api
        run: npm run lint --if-present

      - name: ESLint Web
        working-directory: apps/web
        run: npm run lint --if-present

  # ─── Stage 4c: Unit tests (jest, no DB) ────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Jest (web — frontend unit + components)
        working-directory: apps/web
        run: npx jest --silent --ci

      - name: Jest (api — unit + regression, integration excluded)
        working-directory: apps/api
        # The default jest config already excludes `*.int.spec.ts`;
        # `--maxWorkers=1` matches our local sweep (avoids cross-file
        # mock-state leaks that some suites are sensitive to).
        run: npx jest --silent --ci --maxWorkers=1

  # ─── Stage 4d: Integration tests (jest + PG + Redis services) ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_PASSWORD: admin123
          POSTGRES_USER: postgres
          POSTGRES_DB: jadwal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration suite reads TEST_DATABASE_URL (test/integration/_setup.ts).
      TEST_DATABASE_URL: postgresql://postgres:admin123@localhost:5432/jadwal_test
      DATABASE_URL: postgresql://postgres:admin123@localhost:5432/jadwal_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-secret-not-for-prod
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma schema to test DB
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Jest integration suite
        working-directory: apps/api
        # Hard gate — the integration suite must pass for the PR to merge.
        # The historical `geo-sms-cron.int.spec.ts` cross-file mock-isolation
        # flake was removed together with the SMS feature (PR #264); the suite
        # is stable, so the prior `continue-on-error` soft-fail was dropped at
        # the 2026-06-04 launch.
        run: npx jest --silent --ci --config jest.integration.config.js --maxWorkers=1

  # ─── Stage 5: Security Scan ─────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan for hardcoded secrets, localhost, dev artifacts
      - name: No localhost in source code
        run: |
          FOUND=$(grep -rn "localhost" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" | grep -v "// " | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: localhost found in source code:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No localhost in source code"

      - name: No dev artifacts (devMode, devOtp, mock, sandbox)
        run: |
          # `sandbox=` is the legitimate HTML iframe attribute (used by
          # the Google Maps embed on the activity detail page) so we
          # exclude it from the dev-artifact grep. We're targeting
          # *variable / function names* like `sandboxMode`, `mockApi`,
          # not HTML attributes.
          FOUND=$(grep -rni "devMode\|devOtp\|dev_\b\|mock\b\|sandbox\b\|fake\b" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" \
            | grep -v "node_modules" \
            | grep -v "// " \
            | grep -v ".d.ts" \
            | grep -v 'sandbox="' \
            | grep -v "sandbox='" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Dev artifacts found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dev artifacts"

      - name: No console.log in API source
        run: |
          # Same `grep -v "// "` filter as the other security-grep
          # rules: only real CALLS to console.log are caught, not
          # comment text that happens to mention them.
          FOUND=$(grep -rn "console\.log" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "// " || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: console.log found in API source:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No console.log in API"

      - name: No raw SQL queries
        run: |
          FOUND=$(grep -rn "queryRaw\|executeRaw" apps/api/src/ --include="*.ts" | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Raw SQL found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No raw SQL"

      - name: No dangerouslySetInnerHTML
        run: |
          # Single audited exception: components/json-ld.tsx is the sole
          # sanctioned emitter of schema.org JSON-LD (server-built objects,
          # JSON.stringify'd, with `<` escaped to < so a "</script>"
          # field can't break out). It is NOT a user-HTML sink. The ban stays
          # fully active for every other file. See that file's header.
          FOUND=$(grep -rn "dangerouslySetInnerHTML" apps/web/src/ --include="*.tsx" | grep -v "node_modules" | grep -v "components/json-ld.tsx" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: dangerouslySetInnerHTML found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dangerouslySetInnerHTML"

      - name: No dangerous if(NODE_ENV !== 'production') pattern
        run: |
          # The intent is to catch CONDITIONAL BLOCKS that enable
          # dev-only behaviour in any non-prod env (staging, test):
          #     if (NODE_ENV !== 'production') { skipAuth() }
          # Benign uses where the comparison is a *value* — e.g.
          # `unoptimized={NODE_ENV !== 'production'}` on next/image —
          # are not an auth-or-secret leak vector and are filtered.
          FOUND=$(grep -rnE "\bif\s*\(.*!==\s*['\"]production['\"]" apps/api/src/ apps/web/src/ --include="*.ts" --include="*.tsx" | grep -v "node_modules" | grep -v "// " || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Dangerous if(NODE_ENV !== 'production') pattern found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No dangerous if(NODE_ENV !== 'production') pattern"

      - name: No hardcoded bcrypt rounds
        run: |
          FOUND=$(grep -rn "bcrypt\.hash.*[0-9][0-9]*)" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "BCRYPT_ROUNDS" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: Hardcoded bcrypt rounds found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded bcrypt rounds"

      - name: No seed files in production Docker image
        run: |
          # Original rule banned seed scripts entirely. Refined: seeds
          # are dev/CI tooling (admin bootstrap, e2e fixtures), they
          # live at `apps/api/prisma/seed-*.ts` for local + integration
          # test runs and do NOT ship in the production image. The
          # production Dockerfile (apps/api/Dockerfile) only copies
          # `dist/`, `node_modules/`, `package.json`, and `prisma/
          # schema.prisma` + `prisma/migrations/` — seed scripts are
          # excluded by virtue of not being on the COPY list.
          # This step verifies that exclusion explicitly.
          OFFENDING=$(grep -E "^COPY.*seed" apps/api/Dockerfile 2>/dev/null || true)
          if [ -n "$OFFENDING" ]; then
            echo "❌ FAILED: prod Dockerfile copies a seed script:"
            echo "$OFFENDING"
            exit 1
          fi
          echo "✅ Seed scripts excluded from prod image"

      - name: No CORS wildcards
        run: |
          FOUND=$(grep -rn "origin.*true\|origin.*\*" apps/api/src/ --include="*.ts" | grep -v "node_modules" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: CORS wildcard found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No CORS wildcards"

      - name: No include payment true (field leak)
        run: |
          FOUND=$(grep -rn "include.*payment.*true" apps/api/src/ --include="*.ts" | grep -v "node_modules" | grep -v "select" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ FAILED: include payment true found (leaks gateway fields):"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No payment field leaks"

      - name: .env files are gitignored
        run: |
          if git ls-files --cached apps/api/.env apps/web/.env 2>/dev/null | grep -q ".env"; then
            echo "❌ FAILED: .env files are tracked by git"
            exit 1
          fi
          echo "✅ .env files not tracked"

  # ─── Stage 3: Build Docker Images ──────────────────────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [typecheck, audit, secrets, prisma, security, lint, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API Docker image
        # Build from the monorepo ROOT so the Dockerfile's
        # `COPY package.json package-lock.json ./` and `COPY
        # turbo.json ./` resolve. The image references monorepo-
        # level files (workspaces, lockfile, turbo config) so it
        # can't be built from inside `apps/api/`.
        run: docker build -f apps/api/Dockerfile -t jadwal-api:${{ github.sha }} .

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: [typecheck, audit, secrets, prisma, security, lint, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Web Docker image
        # Same reason as build-api above: monorepo root context for
        # the Dockerfile's root-level COPYs (lockfile, turbo.json,
        # apps/api/package.json for cross-workspace resolution).
        # API_PROXY_TARGET is required at build time because
        # next.config.ts evaluates the prod-guard while Next compiles
        # the config. We pass a placeholder here — real prod values
        # come from ECS task-definition env, not the image.
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.jadwal.qa/api' }} \
            --build-arg NEXT_PUBLIC_VAPID_KEY=${{ vars.NEXT_PUBLIC_VAPID_KEY || '' }} \
            --build-arg API_PROXY_TARGET=${{ secrets.API_PROXY_TARGET || 'https://api.placeholder.com/api' }} \
            -t jadwal-web:${{ github.sha }} .

  # ─── Stage 6: Bundle size budget ───────────────────────────────
  # Catches accidental dependency creep on apps/web. Default budget
  # is 5 MiB of `.next/static`; tighten in scripts/bundle-size-check.sh
  # once the bundle stabilises.
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle size check
        env:
          NEXT_PUBLIC_API_URL: "https://api.placeholder.com/api"
          # next.config.ts ships a strict `[FATAL] API_PROXY_TARGET
          # must be set in production` guard. `next build` runs with
          # NODE_ENV=production by default, so the guard fires here
          # too. We're not actually proxying anything from a CI
          # bundle-size run, so a placeholder value is fine — it
          # just satisfies the throw.
          API_PROXY_TARGET: "https://api.placeholder.com/api"
        # Invoke via `bash` instead of `./...` because the executable
        # bit is not preserved when the repo is checked out on a
        # Windows host (Git's filemode handling can drop +x).
        run: bash scripts/bundle-size-check.sh

  # ─── Deploy to AWS (REMOVED 2026-04-29 — superseded by deploy.yml) ────
  # Deploy is now exclusively handled by .github/workflows/deploy.yml.
  # Keeping a deploy job here too would mean two parallel deploy attempts
  # on every push to main (race condition, conflicting task-def revisions,
  # ALB target-group flapping). deploy.yml has the better pattern:
  # SHA-tagged images (not :latest), separate migrate task before service
  # update, smoke test after, deployment circuit breaker with auto-rollback.
